<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Asistente Inteligente</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login-view" class="card">
  <h1>Asistente Inteligente</h1>
  <p class="subtitle">Inicia sesión</p>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Contraseña">
  <button onclick="iniciarSesion()">Ingresar</button>
  <p id="error-msg" class="error"></p>
  <p class="switch-link">¿No tienes cuenta? <a onclick="mostrarRegistro()">Regístrate</a></p>
</div>

<div id="registro-view" class="card hidden">
  <h1>Crear Cuenta</h1>
  <p class="subtitle">Registro de nuevo usuario</p>
  <input type="text" id="reg-nombre" placeholder="Nombre completo">
  <input type="email" id="reg-email" placeholder="Email">
  <input type="password" id="reg-password" placeholder="Contraseña">
  <select id="reg-rol">
    <option value="administrador">Administrador</option>
    <option value="operador">Operador</option>
    <option value="tecnico">Servicio técnico</option>
  </select>
  <button onclick="registrarUsuario()">Crear cuenta</button>
  <p id="registro-error-msg" class="error"></p>
  <p id="registro-ok-msg" class="ok"></p>
  <p class="switch-link">¿Ya tienes cuenta? <a onclick="mostrarLogin()">Inicia sesión</a></p>
</div>

<div id="dashboard-view" class="card hidden">
  <div class="header">
    <div>
      <h2 id="saludo"></h2>
      <span id="rol-badge" class="badge"></span>
    </div>
    <button class="logout" onclick="cerrarSesion()">Salir</button>
  </div>

  <div id="seccion-alertas" class="section hidden">
    <h3>Alertas recientes</h3>
    <div id="lista-alertas"></div>
  </div>

  <div id="seccion-dispositivos" class="section hidden">
    <h3>Dispositivos</h3>
    <div id="lista-dispositivos"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
